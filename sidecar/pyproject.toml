[project]
name = "memorycore-sidecar"
version = "0.1.0"
description = "Loopback HTTP sidecar protocol for EmoAgent MemoryCore mirror operations."
requires-python = ">=3.12,<3.13"
dependencies = ["triviumdb==0.7.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["memorycore_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
