case_id: EC002_repeat_session_idempotency
description: repeating the same extraction window does not create or reinforce a duplicate fact.
seed:
  sessions:
    - id: s1
      channel: api
  entities:
    - id: user
      canonical_name: Long
      entity_type: user
  episodes:
    - id: ep1
      session_id: s1
      content: 我不喜欢早上八点开会。
      occurred_at: "2026-04-28T09:00:00+08:00"
steps:
  - id: first
    action: apply_extraction_response
    apply_extraction_response:
      request_id: repeat_a
      session_id: s1
      episode_ids: [ep1]
      response_fixture: testdata/memory_eval/extraction_consolidation/responses/EC002_a.json
      allow_inference: true
  - id: rerun
    action: apply_extraction_response
    apply_extraction_response:
      request_id: repeat_b
      session_id: s1
      episode_ids: [ep1]
      response_fixture: testdata/memory_eval/extraction_consolidation/responses/EC002_b.json
      allow_inference: true
assertions:
  - type: apply_status
    step: rerun
    status: skipped
    candidate_id: f_dislike_8am
    action: duplicate_apply
    equals: skipped
  - type: sql_count
    query: "SELECT COUNT(*) FROM facts WHERE persona_id = 'default' AND predicate = 'dislikes'"
    equals: "1"
  - type: sql_value
    query: "SELECT reinforcement_count FROM facts WHERE predicate = 'dislikes'"
    equals: "0"
  - type: no_duplicate_by_key
    predicate: dislikes
